services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apartment_finder
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: apartment_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_finder"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
