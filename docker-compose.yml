services:
  temporal:
    image: temporalio/temporal:latest
    # The local dev server must be able to write the root-owned named volume.
    user: "0:0"
    profiles: [temporal]
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/data/temporal.db
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal_data:/data

  # Human review of POI labels (training/label_studio.py). Local only, so
  # the throwaway login below is fine — never expose this port publicly.
  label-studio:
    image: heartexlabs/label-studio:latest
    # Same reason as temporal: the image's default user can't write the
    # root-owned named volume.
    user: "0:0"
    profiles: [labeling]
    environment:
      LABEL_STUDIO_USERNAME: admin@localhost.dev
      LABEL_STUDIO_PASSWORD: local_dev_only
      LABEL_STUDIO_DISABLE_SIGNUP_WITHOUT_LINK: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - label_studio_data:/label-studio/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apartment_finder
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: apartment_finder
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apartment_finder"]
      interval: 2s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  temporal_data:
  label_studio_data:
